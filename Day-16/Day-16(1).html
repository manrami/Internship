<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Forge | Next-Gen Resume Builder</title>
    <link rel="stylesheet" href="Day-16(1).css">
</head>
<body>
    <div class="header-title">
        <h1>✨ AI Resume Forge</h1>
        <p>Build your professional future in seconds with our AI-powered engine.</p>
    </div>

    <div class="container">
        <div class="form-section">
            <h2><span class="icon">🤖</span> Input Your Data</h2>
            <form id="resumeForm">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <textarea id="education" placeholder="Education (e.g., B.S. in Computer Science - University X)"></textarea>
                <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
                <textarea id="projects" placeholder="Projects (Describe your key projects)"></textarea>
                <textarea id="experience" placeholder="Work Experience"></textarea>
                <textarea id="certifications" placeholder="Certifications"></textarea>
                
                <button type="button" class="btn-generate" onclick="generateResume()">
                    🚀 Generate AI Resume
                </button>
            </form>
        </div>
        
        <div class="preview-section">
            <h2><span class="icon">📄</span> Live Preview</h2>
            <p style="color: #64748b; font-size: 14px; margin-top: -15px; margin-bottom: 20px;">
                💡 <em>Click anywhere on the generated resume to edit the text directly!</em>
            </p>
            <div id="loadingAi" class="hidden">
                <div class="spinner"></div>
                <p>AI is analyzing and formatting your data...</p>
            </div>
            <div id="resumeOutput" class="resume-preview hidden" contenteditable="true" spellcheck="false">
                <!-- Resume content generated by JS will go here -->
            </div>
            <button id="downloadBtn" class="btn-download hidden" onclick="downloadResume()">
                ⬇️ Download Resume
            </button>
        </div>
    </div>
    <script src="Day-16(1).js"></script>
</body>
</html>
