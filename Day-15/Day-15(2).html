<!DOCTYPE html>
<html>
<head>
    <title>AI Support Chatbot (Advanced Premium)</title>
    <link rel="stylesheet" href="Day-15(2).css">
</head>

<body>

    <div class="chat-container">

        <h2>AI Assistant</h2>

        <div id="chatbox">
            <div class="message-wrapper bot-wrapper">
                <div class="message bot-message">Hello! I am your advanced AI assistant. How can I help you today?</div>
                <div class="timestamp">Just now</div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput"
                   placeholder="Type your message..."
                   onkeypress="handleKeyPress(event)"
                   autocomplete="off">
            <button onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>

    </div>

    <script src="Day-15(2).js"></script>

</body>
</html>
